name: WatchTracker Android Build

on:
  workflow_dispatch:

jobs:
  android-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: android-actions/setup-android@v3
      - name: Pin Android SDK/NDK
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.15729638"
      - run: npm ci
      - run: npx tauri android build --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: watchtracker-android-debug
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
